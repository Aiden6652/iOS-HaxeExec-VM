name: build-ipa

# 产出两样东西：
#   1) iOS 真机 arm64 的 Unicorn 静态库 —— 整个项目的地基，先验证它编得出来
#   2) 未签名 IPA（App 层写完会自动打包；未写完则该步跳过并报警）
#
# 关于签名：GitHub Actions 上没有你的 Apple 账号，产出的 IPA 一律是未签名的。
# 装到设备上之前需要你自己重签（SideStore / AltStore / 开发者证书均可）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "最低 iOS 版本"
        required: false
        default: "15.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 装构建工具
        run: |
          brew install cmake ninja
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path

      - name: 拉 Unicorn 源码
        run: ./scripts/fetch-unicorn.sh

      - name: 让 Unicorn 能编到 iOS（绕开 JIT API 的可用性标注）
        run: |
          # iOS SDK 把 pthread_jit_write_protect_np 标为 unavailable。
          # 它是 iOS 上跑 TCG 的必需品，有 JIT 权限就能用，只是 SDK 不让普通 App 用。
          ./scripts/patch-unicorn-ios.sh

      - name: 交叉编译 Unicorn（iOS 真机 / arm64）
        run: |
          cmake -G Ninja -B build-unicorn-ios -S unicorn \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET="${{ inputs.deployment_target || '15.0' }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_SAMPLES=OFF \
            -DUNICORN_BUILD_TESTS=OFF
          # 只构建静态库本身。构建 all 会把 Unicorn 自带的示例程序
          # （sample_x86 / mem_apis ...）也一起链 —— 那些是 macOS 可执行文件，
          # 在 iOS 上必然 "ld: symbol(s) not found for architecture arm64"。
          ninja -C build-unicorn-ios unicorn

      # 说明：Unicorn 2.x 用的是标准的 BUILD_SHARED_LIBS，不是 v1 的
      # UNICORN_BUILD_SHARED。传错名字不会报错，只是悄悄继续构建 dylib，
      # 然后在 iOS 上链接失败（iOS 上我们只要静态库）。

      - name: 确认静态库落地
        run: |
          find build-unicorn-ios -name "libunicorn*.a" -print -exec lipo -info {} \;
          test -n "$(find build-unicorn-ios -name 'libunicorn*.a' -print -quit)" \
            || { echo "::error::Unicorn 静态库没编出来"; exit 1; }

      - name: 整理成 include/ + lib/ 的标准布局
        run: |
          # 源码目录有 include/，静态库在构建目录 —— 合成一个 staging 供后续使用。
          # 注意要复制全部 .a：libunicorn-static.a 只有核心代码，
          # 各架构的 *-softmmu.a 才是 uc_open() 需要的 _uc_init_x86_64 等符号所在。
          mkdir -p .unicorn-stage/include .unicorn-stage/lib
          cp -R unicorn/include/unicorn .unicorn-stage/include/
          find build-unicorn-ios -name "*.a" -exec cp {} .unicorn-stage/lib/ \;
          find .unicorn-stage -maxdepth 2 | sort

      - name: 上传 Unicorn iOS 静态库
        uses: actions/upload-artifact@v4
        with:
          name: libunicorn-ios-arm64
          path: build-unicorn-ios/libunicorn*.a
          if-no-files-found: error

      # ── App 层：platform/ios 下的宿主代码 + 游戏本体就绪后才打包 ──
      - name: 打包未签名 IPA
        id: ipa
        continue-on-error: true
        run: |
          ./platform/ios/build-app.sh \
            --config Release \
            --unicorn "$PWD/.unicorn-stage" \
            --out "$PWD/dist/HXVM.ipa"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # 用「文件在不在」来判断，别去依赖上一步的 output。
      # —— output 依赖写法在 continue-on-error 的步骤上并不总是按预期工作，
      # 结果是静态库上传了、IPA 却没上传。
      - name: 上传 IPA
        if: ${{ hashFiles('dist/HXVM.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: HXVM-unsigned-ipa
          path: dist/HXVM.ipa
          if-no-files-found: error

      - name: 小结
        run: |
          echo "### iOS 构建" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unicorn(iOS arm64 静态库)：已产出" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.ipa.outputs.skipped }}" = "true" ]; then
            echo "- IPA：跳过（App 层尚未提交）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- IPA：已产出（**未签名**，装设备前需自签）" >> "$GITHUB_STEP_SUMMARY"
          fi
